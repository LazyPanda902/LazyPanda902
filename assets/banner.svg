<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.48" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="80" y1="70" x2="1110" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22c55e"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientTransform="translate(1010 90) rotate(90) scale(90)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientTransform="translate(900 220) rotate(90) scale(110)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>

  <circle cx="1010" cy="90" r="90" fill="url(#orb1)"/>
  <circle cx="900" cy="220" r="110" fill="url(#orb2)"/>

  <path d="M72 256 C250 118, 408 300, 580 166 S858 88, 1134 220"
        stroke="url(#accent)"
        stroke-width="3"
        opacity="0.58"
        filter="url(#glow)"/>

  <path d="M84 74 H1110" stroke="url(#accent)" stroke-width="2" opacity="0.18"/>
  <path d="M84 250 H1110" stroke="url(#accent)" stroke-width="2" opacity="0.14"/>

  <circle cx="1000" cy="95" r="52" stroke="#22c55e" stroke-width="3" opacity="0.66"/>
  <circle cx="1066" cy="176" r="34" stroke="#38bdf8" stroke-width="3" opacity="0.58"/>
  <circle cx="912" cy="206" r="22" stroke="#a855f7" stroke-width="3" opacity="0.52"/>

  <text x="88" y="122"
        fill="#f8fafc"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="52"
        font-weight="800">Ali Bidhendi</text>

  <text x="92" y="169"
        fill="#cbd5e1"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        font-weight="600">IT Support · Microsoft 365 · Homelab Automation</text>

  <text x="92" y="214"
